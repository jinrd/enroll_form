appId: com.pdf.generator.app
productName: pdf 생성기
compression: maximum
directories:
  output: build
  buildResources: build
files:
  - 'out/**/*'
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
extraResources:
  - from: resources
    to: .
    filter:
      - 'basic_enrollment_template.pdf'
      - 'NanumGothic.ttf'
      - 'courses.json'
win:
  executableName: pdf_generator
  target:
    - target: squirrel
      arch:
        - x64
squirrelWindows:
  name: pdf_generator
npmRebuild: false
publish:
  provider: github
  owner: jinrd
  repo: enroll_form
  releaseType: release
